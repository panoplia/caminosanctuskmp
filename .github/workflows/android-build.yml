name: Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate SQLDelight interfaces
        run: ./gradlew :shared:generateSqlDelightInterface

      - name: Build shared module
        run: ./gradlew :shared:build

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Verify manifest permissions
        run: |
          grep -E "BIND_VPN_SERVICE|PACKAGE_USAGE_STATS|FOREGROUND_SERVICE" \
            androidApp/build/intermediates/merged_manifests/debug/AndroidManifest.xml
