name: iOS Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14   # Apple Silicon — required for DeviceActivity framework
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP XCFramework
        run: ./gradlew :shared:assembleSharedXCFramework

      - name: Build main app target
        run: |
          xcodebuild \
            -workspace iosApp/CaminoSanctus.xcworkspace \
            -scheme CaminoSanctus \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build DeviceActivity extension target
        run: |
          xcodebuild \
            -workspace iosApp/CaminoSanctus.xcworkspace \
            -scheme CaminoActivityMonitor \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
